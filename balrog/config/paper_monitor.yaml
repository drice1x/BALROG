agent:
  type: custom_monitor
  remember_cot: true
  max_text_history: 16
  max_image_history: 0
  max_cot_history: 1
  max_icl_history: 1000
  cache_icl: false

eval:
  output_dir: results/hack_run
  resume_from: null
  num_workers: 1
  num_episodes:
    babyai: 2
  max_steps_per_episode: null
  save_trajectories: true
  save_images: false
  icl_episodes: 1
  icl_dataset: records
  feedback_on_invalid_action: true
  traj_dir: balrog_monitor_runs/hack_run

client:
  client_name: monitoring_vllm
  model_id: hack
  base_url: http://127.0.0.1:8000/v1
  generate_kwargs:
    temperature: 0.0
    max_tokens: 256
    thinking_budget: null
  timeout: 60
  max_retries: 5
  delay: 2
  alternate_roles: false

envs:
  names: babyai
  env_kwargs:
    seed: null
  babyai_kwargs:
    num_dists: 0

tasks:
  babyai_tasks:
    - "BabyAI-GoToLocal-v0/goto"

hydra:
  run:
    dir: .
  output_subdir: null